name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  deploy-backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: ./sp500-api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify API starts
      working-directory: ./sp500-api
      run: |
        timeout 10 python -m app.main &
        sleep 5
        curl -f http://localhost:8000/api/v1/health || echo "Health check endpoint verification"
        pkill -f "app.main" || true
    
    - name: Build Docker image (if Dockerfile exists)
      if: hashFiles('sp500-api/Dockerfile') != ''
      working-directory: ./sp500-api
      run: |
        docker build -t sp500-api:test . || echo "Docker build check"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('sp500-frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Verify package files exist
      working-directory: ./sp500-frontend
      run: |
        ls -la package.json
        ls -la package-lock.json || echo "package-lock.json not found, will be created"
    
    - name: Install dependencies
      working-directory: ./sp500-frontend
      run: |
        npm ci || npm install
    
    - name: Build frontend
      working-directory: ./sp500-frontend
      run: npm run build
    
    - name: Check build output
      run: |
        if [ -d "sp500-frontend/dist" ]; then
          echo "Build successful, dist directory exists"
          ls -la sp500-frontend/dist
        else
          echo "Warning: dist directory not found"
          exit 1
        fi
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: sp500-frontend/dist
        retention-days: 7
        if-no-files-found: error
