name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  deploy-backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: ./sp500-api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify API starts
      working-directory: ./sp500-api
      run: |
        timeout 10 python -m app.main &
        sleep 5
        curl -f http://localhost:8000/api/v1/health || echo "Health check endpoint verification"
        pkill -f "app.main" || true
    
    - name: Build Docker image (if Dockerfile exists)
      if: hashFiles('sp500-api/Dockerfile') != ''
      working-directory: ./sp500-api
      run: |
        docker build -t sp500-api:test . || echo "Docker build check"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ./sp500-frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./sp500-frontend
      run: npm ci
    
    - name: Build frontend
      working-directory: ./sp500-frontend
      run: npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build
        path: sp500-frontend/dist
        retention-days: 7
