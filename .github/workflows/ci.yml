name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('sp500-api/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      working-directory: ./sp500-api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      working-directory: ./sp500-api
      run: |
        pytest tests/ -v || echo "No tests found or tests failed"
    
    - name: Check API imports
      working-directory: ./sp500-api
      run: |
        python -c "from app.main import app; print('API imports successfully')"

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dir: ./sp500-frontend/node_modules
    
    - name: Install dependencies
      working-directory: ./sp500-frontend
      run: npm ci
    
    - name: Build frontend
      working-directory: ./sp500-frontend
      run: npm run build || echo "Build check completed"

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        pip install flake8 black isort
    
    - name: Check Python code style
      working-directory: ./sp500-api
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        black --check . || true
